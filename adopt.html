  <div class="container my-5">
    <div class="form-card">
      <h2 class="text-center mb-4">Adopt a Pet</h2>
      <form action="adopt_process.php" method="POST" class="row g-4 needs-validation" novalidate>

        <div class="col-md-6">
          <label for="pet" class="form-label">Select Pet</label>
          <select class="form-select" id="pet" name="pet" required>
            <option selected disabled value="">Choose a pet...</option>
            <option value="Shorthair Cat">Shorthair Cat</option>
            <option value="Longhair Cat">Longhair Cat</option>
            <option value="Labrador Puppy">Labrador Puppy</option>
          </select>
          <div class="invalid-feedback">Please select a pet.</div>
        </div>

        <div class="col-md-6">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="name" name="name" placeholder="" required />
          <div class="invalid-feedback">Your name is required.</div>
        </div>

        <div class="col-md-6">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="" required />
          <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>

        <div class="col-md-6">
          <label for="phone" class="form-label">Phone Number</label>
          <input type="tel" class="form-control" id="phone" name="phone" placeholder="9876543210" pattern="[0-9]{10}" required />
          <div class="invalid-feedback">Please enter a 10-digit phone number.</div>
        </div>

        <div class="col-12">
          <label for="address" class="form-label">Address</label>
          <textarea class="form-control" id="address" name="address" rows="3" placeholder="Your full address..." required></textarea>
          <div class="invalid-feedback">Please provide your address.</div>
        </div>

        <div class="col-12">
          <label for="reason" class="form-label">Why do you want to adopt this pet?</label>
          <textarea class="form-control" id="reason" name="reason" rows="4" placeholder="Share your reason..." required></textarea>
          <div class="invalid-feedback">Please explain your reason.</div>
        </div>

        <div class="col-12 text-center">
          <button class="btn btn-success btn-lg mt-3" type="submit">Submit Application</button>
        </div>

      </form>
    </div>
  </div>

  <!-- Toast (optional UX feedback on submission) -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
    <div id="successToast" class="toast align-items-center text-white bg-success border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body">Application submitted successfully!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      'use strict';
      const forms = document.querySelectorAll('.needs-validation');
      Array.from(forms).forEach(form => {
        form.addEventListener('submit', event => {
          if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
          } else {
            // Optional: Show toast feedback
            const toastEl = document.getElementById('successToast');
            const toast = new bootstrap.Toast(toastEl);
            toast.show();
          }
          form.classList.add('was-validated');
        }, false);
      });
    })();
  </script>
