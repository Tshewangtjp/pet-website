<script>
  const petContainer = document.getElementById("petContainer");
  const pagination = document.getElementById("pagination");
  const petsPerPage = 9;
  let currentPage = 1;

  function renderPets() {
    petContainer.innerHTML = "";

    const start = (currentPage - 1) * petsPerPage;
    const end = start + petsPerPage;
    const petsToShow = petData.slice(start, end);

    petsToShow.forEach((pet, index) => {
      const col = document.createElement("div");
      col.className = "col-md-6 col-lg-4";

      const card = `
        <div class="card pet-card fade-in h-100">
          <img src="${pet.img}" class="card-img-top" alt="${pet.name}">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title fw-bold">${pet.name}</h5>
            <div class="pet-price mb-2">₹${pet.price}</div>
            <div class="mb-2">
              <span class="badge bg-light text-dark badge-icon shadow-sm"><i class="bi bi-calendar-heart"></i> ${pet.age}</span>
              <span class="badge bg-light text-dark badge-icon shadow-sm"><i class="bi bi-patch-question"></i> ${pet.breed}</span>
            </div>
            <p class="pet-desc">${pet.desc}</p>
            <div class="mt-auto d-flex justify-content-between">
              <a href="adopt.html" class="btn btn-success btn-sm text-decoration-none">Adopt Now</button>
              <a href="single.html" class="btn btn-outline-secondary btn-sm">View Details</a>
            </div>
          </div>
        </div>
      `;
      col.innerHTML = card;
      petContainer.appendChild(col);
    });
  }

  function renderPagination() {
    pagination.innerHTML = "";
    const totalPages = Math.ceil(petData.length / petsPerPage);

    const prev = `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage - 1})">&laquo;</a>
                  </li>`;
    pagination.innerHTML += prev;

    for (let i = 1; i <= totalPages; i++) {
      pagination.innerHTML += `
        <li class="page-item ${currentPage === i ? 'active' : ''}">
          <a class="page-link" href="#" onclick="changePage(${i})">${i}</a>
        </li>`;
    }

    const next = `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="changePage(${currentPage + 1})">&raquo;</a>
                  </li>`;
    pagination.innerHTML += next;
  }

  function changePage(page) {
    const totalPages = Math.ceil(petData.length / petsPerPage);
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    renderPets();
    renderPagination();
  }

  // Initial render
  renderPets();
  renderPagination();
</script>
